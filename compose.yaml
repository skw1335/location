# Local Postgres for the API: ParadeDB (Postgres 18 + pg_search, PostGIS,
# pgvector). Start with `docker compose up -d` (OrbStack provides docker).
services:
  db:
    image: paradedb/paradedb:0.26.1-pg18
    container_name: location-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: location
      POSTGRES_PASSWORD: location
      POSTGRES_DB: location
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data in a versioned subdirectory of this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "location"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
    name: location-pgdata
